github_repository:
  configured: "2026-10-01"
  url: https://github.com/bk201-/personal-hub
  visibility: private
  local_remote: origin
  state: Empty repository; no commits or branches pushed.
  source_settings: bk201-/tg-news-reader
  matched:
    - Merge methods, merge commit messages and merged-branch retention.
    - Issues, projects, wiki and discussions disabled.
    - Actions enabled with read-only default token permissions and no PR review approval permission.
    - Dependabot vulnerability alerts and security updates enabled.
    - Source dependency labels added; the new default accessibility label retained.
    - Cloud-agent validation tools, firewall and workflow-approval settings match the source defaults.
  intentional_differences:
    - The source repository is public; this repository remains private.
    - Auto-merge remains disabled, and no CI or deployment workflows have been published.
    - Source Dependabot security updates were paused; the new repository reports them unpaused.
  blockers:
    - GitHub rejected private-repository ruleset creation with HTTP 403 requiring GitHub Pro.
    - GitHub rejected repository secret scanning and push protection with HTTP 422 as unavailable.
  pending:
    - Publish adapted agent instructions and skills only with an explicitly authorized push.
    - Adapt PR CI for the monorepo before requiring its Build & Lint status check.
    - Confirm personal-account Copilot repository access; matching cloud-agent configuration does not prove access.
    - Resolve private-repository feature availability before claiming protection parity with the source.
  guardrails:
    - No secrets were copied and the source repository was not modified.
    - Do not change visibility, purchase a plan or enable deployment to work around feature restrictions.

