suggested_next_work:
  interpretation: >-
    These are continuation options, not authorization to run every step.
    Follow the user's selected task and resolve its prerequisites first.
  items:
    - id: news-local-acceptance
      state: pending
      work:
        - Review the current diff and news setup instructions.
        - Agree whether to use an empty local database or an isolated copy of existing data.
        - If copying data, use a consistent database snapshot; migrate only the copy.
        - Configure a separate local Telegram session when the user is ready to authenticate.
        - Exercise channels, reading state, media, login/refresh and the update banner.
      guardrails:
        - Never point the new application at the original or production database by default.
        - Never reuse the active production TG_SESSION in a second running client.
        - Keep secrets out of repository files, logs and chat transcripts.
      done_when: Representative news workflows work locally without changing the old installation.
    - id: cv-visual-acceptance
      state: pending
      work:
        - Start the CV workspace using its documented local command.
        - Review desktop/mobile appearance, links and print layout.
        - Regenerate the PDF only as an explicit task; preserve the existing artifact otherwise.
      done_when: User accepts the site and print output or concrete follow-up issues are recorded.
    - id: music-provider-feasibility
      state: awaiting_sources_and_credentials
      plan: plans/music-discovery/implementation.yaml
      first_slice: provider-feasibility
      done_when: Real permitted access works for representative sources, or a blocker is documented.
    - id: czech-product-direction
      state: awaiting_product_decision
      work:
        - Review existing recognition/import results and a few representative examples.
        - Agree the first useful end-to-end learning workflow.
        - Choose targeted reuse versus rebuilding the product UI/domain implementation.
      done_when: A scoped next slice is agreed without assuming the historical plan is still desired.
    - id: container-acceptance
      state: pending
      work:
        - Confirm downloading the missing base image is acceptable; no image publication is needed.
        - Build and run the two existing application Dockerfiles with isolated configuration/data.
      done_when: Actual Linux containers run independently; Windows layout checks alone are insufficient.
    - id: publication-decision
      state: remote_configured_publication_deferred
      work:
        - Review and commit pending imports only when requested.
        - Authorize the first push separately; the private GitHub repository and origin already exist.
        - Resolve the GitHub protection blockers and adapt monorepo CI before enabling required checks.
        - Separately decide runtime hosting, releases, secrets and deployment activation.
      guardrail: Archived deployment workflows are historical reference, not runnable setup instructions.

