recovery:
  sibling_original_repositories:
    - tg-news-reader
    - czech-learning
    - dmitriishilov.com
  sibling_backup_directory: personal-hub-backup-20260930
  news_history: 198 original main commits retained with original IDs; all-ref bundle in backup.
  czech_history: No original commits; raw worktree/index snapshots preserve the pre-import state.
  cv_history: 10 original commits retained under refs/archive/dmitriishilov.com/heads/main and in a verified bundle.
  cv_backup_subdirectory: cv-import
  portability: >-
    Sibling originals/backups and archive refs are local recovery aids, not
    runtime dependencies. Do not assume a later clone includes them.

continuation:
  - Read the relevant application guidance and linked plan for the user's chosen task.
  - Inspect current Git state and package scripts instead of repeating migration setup.
  - Update this handoff when a decision, remaining milestone or known limitation materially changes.
  - Keep product requirements in their linked plans; do not duplicate them here.
  - No Scout tools, chat history or session-local files are required to continue.
